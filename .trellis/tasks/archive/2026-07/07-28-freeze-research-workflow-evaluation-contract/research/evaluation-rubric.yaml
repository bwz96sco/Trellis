# Frozen evaluation rubric — evaluation-contract-v1.0.0
# Freeze predates all scored evidence. Scores cannot override hard_gates.

version: evaluation-contract-v1.0.0
scale:
  min: 0
  max: 4
  meaning:
    0: absent or contradictory
    1: fragmentary
    2: partial with material gaps
    3: mostly complete, minor gaps
    4: complete and enforceable
dimensions:
  - id: ordered_stage_contract_clarity
    weight: 0.15
    description: Ordered stages and activation/stop contracts are explicit.
  - id: io_durable_artifact_completeness
    weight: 0.15
    description: Inputs/outputs and durable artifacts fully specified.
  - id: authority_mutation_privacy
    weight: 0.15
    description: Authority, mutation, and privacy boundaries explicit and fail-closed.
  - id: evidence_provenance_stable_ids
    weight: 0.15
    description: Provenance and stable cross-stage IDs continuous.
  - id: validator_fail_closed
    weight: 0.20
    description: Validator coverage and fail-closed enforcement.
  - id: closure_failure_semantics
    weight: 0.10
    description: Success/null/partial/failed/blocked/inconclusive explicit.
  - id: handoff_composition
    weight: 0.10
    description: Handoffs and bounded composition consistent.
hard_gates:
  - no_unauthorized_canonical_mutation
  - no_silent_success_missing_critical_evidence
  - traceable_provenance_stable_ids
  - every_durable_output_mapped_or_waived
  - explicit_null_partial_blocked_failed_inconclusive
  - explicit_bounded_composition
  - no_private_source_leakage
  - no_unapproved_unresolved_critical_behavior
disposition_evidence_rule: >
  preserve or translate requires at least two independent evidence references
  (normally source contract plus validator/test/fixture).
